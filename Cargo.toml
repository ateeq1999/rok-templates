[package]
name = "rok-templates"
description = "The project templates `rok init --template` writes, and their catalog: actix-web, axum and gRPC (tonic) APIs, and a monorepo of an axum API with web, desktop and mobile apps"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ateeq1999/rok-templates"
rust-version = "1.94"
homepage = "https://github.com/ateeq1999/rok-templates"
authors = ["The rok-data Contributors"]
readme = "README.md"
documentation = "https://docs.rs/rok-templates"
keywords = ["template", "axum", "actix-web", "grpc", "monorepo"]
categories = ["development-tools", "web-programming"]
# Ship what `build.rs` embeds, not a build or an install of a template
# made in place: the same paths `build.rs` leaves out (`tests/package.rs`
# checks the two agree).
include = [
    "/src/**/*.rs",
    "/build.rs",
    "/templates/**",
    "!/templates/*/target/**",
    "!/templates/*/apps/*/target/**",
    "!/templates/**/node_modules/**",
    "!/templates/**/dist/**",
    "!/templates/**/dist-ssr/**",
    "!/templates/**/.output/**",
    "!/templates/**/.tanstack/**",
    "!/templates/**/.vinxi/**",
    "!/templates/**/.wrangler/**",
    "!/templates/**/.DS_Store",
    "!/templates/**/Thumbs.db",
    "!/templates/**/desktop.ini",
    "!/templates/**/.env",
    "!/templates/**/.dart_tool/**",
    "!/templates/**/.pub-cache/**",
    "!/templates/**/build/**",
    "!/templates/**/ephemeral/**",
    "!/templates/**/.gradle/**",
    "!/templates/**/.kotlin/**",
    "!/templates/**/.cxx/**",
    "!/templates/**/Pods/**",
    "!/templates/**/.symlinks/**",
    "!/templates/**/.flutter-plugins",
    "!/templates/**/.flutter-plugins-dependencies",
    "!/templates/**/local.properties",
    "!/templates/**/key.properties",
    "!/templates/**/Generated.xcconfig",
    "!/templates/**/flutter_export_environment.sh",
    "!/templates/**/gradlew",
    "!/templates/**/gradlew.bat",
    "!/templates/**/gradle-wrapper.jar",
    "!/templates/**/GeneratedPluginRegistrant.java",
    "!/templates/**/GeneratedPluginRegistrant.h",
    "!/templates/**/GeneratedPluginRegistrant.m",
    "!/templates/**/*.jks",
    "!/templates/**/*.keystore",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dev-dependencies]
anyhow = "1"
tempfile = "3"
toml = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Its own workspace: the templates' crates build with their own Cargo.lock
# and dependency set, so cargo must not treat this crate as their root.
[workspace]
exclude = ["templates/actix-api", "templates/axum-api", "templates/grpc-api"]
