# The API App's checks, which every change passes: formatting, lints, the
# tests against a real PostgreSQL, the generated code and the architecture
# rules, the dependency policy, the image building, and the Terraform
# (valid, linted, and applied to Floci by `terraform test`). GitHub runs
# workflows from the root's `.github/workflows` only, so each App's live
# here, and each job works in its App's directory.
name: API

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The rok release the generated-code check runs: its minor is the
  # rok-data minor the project's crates use (rok 0.7.x links rok-data 0.7).
  ROK_VERSION: "0.9.0"

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Each test makes a schema of its own in it, and drops it.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The release binary, checked against its published SHA-256: seconds,
      # where building rok from source takes minutes.
      - name: Install rok ${{ env.ROK_VERSION }}
        run: |
          name="rok-${ROK_VERSION}-x86_64-unknown-linux-musl"
          url="https://github.com/ateeq1999/rok-v2/releases/download/v${ROK_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --max-time 120 -O "$url/$name.tar.gz"
          curl -fsSL --retry 3 --max-time 120 -O "$url/$name.tar.gz.sha256"
          sha256sum -c "$name.tar.gz.sha256"
          tar -xzf "$name.tar.gz"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/$name/rok" --version
      - name: The generated code is current, and the architecture rules hold
        run: |
          rok sqlc g --check
          rok sqlc check-arch

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # deny.toml: no known advisory but the ones it lists with a reason,
      # licenses from its allow list, crates from crates.io only. The API's
      # package is the graph's root, not the whole workspace.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/api/Cargo.toml
          command-arguments: --config apps/api/deny.toml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # From the root: the workspace's `Cargo.lock` is there.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    runs-on: ubuntu-latest
    services:
      # envs/local is applied to Floci; its RDS runs a real PostgreSQL
      # container, hence the Docker socket.
      floci:
        image: floci/floci:2.3.0
        ports:
          - 4566:4566
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
    defaults:
      run:
        working-directory: apps/api/deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0
      - run: terraform fmt -check -recursive
      - name: Every environment is valid
        run: |
          for dir in envs/local envs/staging envs/prod bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - run: tflint --recursive
      - name: Apply envs/local to Floci, check it, destroy it
        working-directory: apps/api/deploy/terraform/envs/local
        run: terraform test
