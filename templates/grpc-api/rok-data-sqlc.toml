# The gRPC template's configuration; this file is yours. `rok sqlc g` reads
# it: `schema/` and `queries/` become the data layer in `src/db/`, the
# `users` and `audit_log` API features in `src/features/` (each a tonic
# service), and their `.proto` files in `proto/`. The schema, the queries
# and the history pairs in `migrations/` are the axum template's. See
# README.md.

schema = "schema"
output = "src/db"
# Hand-written SQL, one file per feature: `queries/auth.sql` becomes
# `db::queries::auth`, which only `shared/` calls here (the account flows
# that use the rest stay on the HTTP API).
queries = ["queries/"]
derive = ["serde", "validate"]

[conventions]
primary_key_ids = "uuid_v7"
soft_delete_column = "deleted_at"
# Server-set columns: the database (defaults, `touch_updated_at`) or the
# account flows set them, so no create or update message takes them.
managed_columns = [
    "created_at",
    "updated_at",
    "password_hash",
    "email_verified",
    "totp_secret",
    "totp_enabled",
    "totp_last_step",
    "avatar_key",
    "failed_logins",
    "locked_until",
    "token_version",
]

[modules]
# `AuditLogEntry`, `AuditLogEntryService` in `proto/audit_log_entry.proto`.
audit_log = "audit_log_entry"

[api]
output = "src/features"
# The features are generated for gRPC (engine ADR 0028): a `.proto` per
# Resource under `proto/`, which `build.rs` compiles, and a tonic service
# per feature. gRPC has no OpenAPI document (`openapi` stays off) and pages
# by number (`List`'s `page` and `per_page`), never by cursor.
framework = "grpc"
# `media` and `api_keys` are the HTTP API's hand-written features (uploads,
# API keys); `auth_tokens` and `totp_recovery_codes` belong to the account
# flows and two-factor sign-in, `jobs` and `job_schedules` to the job queue.
exclude = ["media", "api_keys", "auth_tokens", "jobs", "job_schedules", "totp_recovery_codes"]

[api.access]
users = "admin"
audit_log = "admin"

[api.routes]
# The axum template's route, which the shared `service_api.rs` documents
# each method by.
audit_log = "/audit-log"

[api.skip]
# Accounts are created by the sign-up and invitation flows, which hold the
# password; deleted accounts stay deleted.
users = ["create", "restore", "lookups", "relationships"]
# Read-only: the application writes it.
audit_log = ["create", "update", "remove", "relationships"]

[api.hidden]
users = [
    "password_hash",
    "totp_secret",
    "totp_last_step",
    "avatar_key",
    "failed_logins",
    "locked_until",
    "token_version",
    "updated_at",
    "deleted_at",
]

# The axum template's `[api.immutable] users = ["email"]` (an email changes
# only through the verification flow) is left out: rok-data 0.8.0's gRPC
# service doesn't fill an immutable column's DTO field, so the generated
# `users` service would not compile. Until the engine does, `Update` takes
# an `email` an admin may set.

# String rules (VineJS names): an email is trimmed and lowercased before it
# is checked, once a message takes it (none does yet: no create, and the
# update leaves it immutable); a display name is trimmed.
[api.rules.users]
email = ["trim", "toLowerCase", "email"]
display_name = ["trim"]

[api.search]
users = ["email", "display_name"]

[api.sort]
users = ["created_at", "email"]
