syntax = "proto3";

package grpc_api.v1;

import "users.proto";

message SubscribeUserEventsRequest {}

// A user changed: `NOTIFY user_events, '<user id>'` named it.
message UserEvent {
  // The id the notification named.
  string user_id = 1;
  // The user as it is now; left out once the user is gone (deleted).
  User user = 2;
}

service UserEventsService {
  // One event per `NOTIFY user_events, '<user id>'`, for as long as the
  // client stays subscribed. Admins only, as `UsersService` is. A
  // subscriber that falls behind is ended with `RESOURCE_EXHAUSTED`, and
  // one whose database connection drops with `UNAVAILABLE`: notifications
  // may have been missed, so subscribe again and re-read what you show.
  rpc Subscribe(SubscribeUserEventsRequest) returns (stream UserEvent);
}
