name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # fmt, clippy and the crate's own tests (catalog, drift between the
  # templates, packaging). The gates print why they skip: no ROK_DATA_BIN.
  check:
    name: Check (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.94", stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked

  # The gates: each template made into a project by the rok-data generator
  # at the pin in rok-data.pin, built against this checkout's templates
  # (`init` copies the templates embedded in the binary), then generated,
  # compiled and tested. One job per toolchain the Apps need.
  gates:
    name: Gates (${{ matrix.gate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: api templates
            tests: --skip web_app --skip mobile_app --skip desktop_app --skip dart_client
          - gate: web
            tests: web_app
          - gate: desktop
            tests: desktop_app
          - gate: mobile
            tests: mobile_app dart_client
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROK_DATA_SQLC_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          path: rok-templates
      - name: Read the pin
        id: pin
        run: |
          pin=$(tr -d '[:space:]' < rok-templates/rok-data.pin)
          echo "ref=$pin" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags https://github.com/ateeq1999/rok-data "refs/tags/$pin" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::skipping the gates: rok-data $pin is not tagged yet"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.pin.outputs.ready == 'true'
        with:
          repository: ateeq1999/rok-data
          ref: ${{ steps.pin.outputs.ref }}
          path: rok-data
      - uses: dtolnay/rust-toolchain@master
        if: steps.pin.outputs.ready == 'true'
        with:
          toolchain: "1.94"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        if: steps.pin.outputs.ready == 'true'
        with:
          key: gates-${{ matrix.gate }}
          workspaces: |
            rok-data
            rok-templates
      - name: Install GPUI's Linux libraries
        if: steps.pin.outputs.ready == 'true' && matrix.gate == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libx11-xcb-dev libxcb1-dev
      # bun is pinned to the version the template's bun.lock was written
      # with; Node 22 (LTS) runs vitest.
      - uses: oven-sh/setup-bun@v2
        if: matrix.gate == 'web'
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        if: matrix.gate == 'web'
        with:
          node-version: 22
      # The web App as it sits in the template needs no generator.
      - name: Gate the sourced web App
        if: matrix.gate == 'web'
        working-directory: rok-templates/templates/monorepo/apps/web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
      - uses: subosito/flutter-action@v2
        if: steps.pin.outputs.ready == 'true' && matrix.gate == 'mobile'
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Build the generator against this checkout
        if: steps.pin.outputs.ready == 'true'
        working-directory: rok-data
        run: cargo build -p rok-data-cli --config "patch.crates-io.rok-templates.path='$GITHUB_WORKSPACE/rok-templates'"
      - name: Run the gates
        if: steps.pin.outputs.ready == 'true'
        working-directory: rok-templates
        env:
          ROK_DATA_BIN: ${{ github.workspace }}/rok-data/target/debug/rok-data
          ROK_DATA_PATH: ${{ github.workspace }}/rok-data
        run: cargo test --test gates --locked -- --test-threads=1 ${{ matrix.tests }}
