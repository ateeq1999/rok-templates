name: Release

# Tag vX.Y.Z (equal to Cargo.toml's version, with a `## [X.Y.Z]` section in
# CHANGELOG.md) to publish rok-templates to crates.io.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the version and the changelog
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "${GITHUB_REF_NAME}" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no ## [$version] section"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
